openapi: 3.1.0
info:
  title: Agricultural federation API
  version: 0.0.2
  description: |
    Version v0.0.2 :
    - Ajout fonctionnalité J (identity collectivity)

servers:
  - url: http://localhost:8080

paths:

  /collectivities:
    post:
      summary: Create list of collectivities (A)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateCollectivity'
      responses:
        201:
          description: Created collectivities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Collectivity'

  /members:
    post:
      summary: Create list of members (B-2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateMember'
      responses:
        201:
          description: Created members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
        400:
          description: Invalid referees or payment

  /collectivities/{id}/identity:
    put:
      summary: Assign unique number and name (J)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectivityIdentity'
      responses:
        200:
          description: Identity assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collectivity'
        400:
          description: Already assigned
        409:
          description: Name or number already exists
        404:
          description: Collectivity not found

components:
  schemas:

    CreateCollectivity:
      type: object
      properties:
        location:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/MemberIdentifier'
        federationApproval:
          type: boolean
        structure:
          $ref: '#/components/schemas/CreateCollectivityStructure'

    CreateCollectivityStructure:
      type: object
      properties:
        president:
          $ref: '#/components/schemas/MemberIdentifier'
        vicePresident:
          $ref: '#/components/schemas/MemberIdentifier'
        treasurer:
          $ref: '#/components/schemas/MemberIdentifier'
        secretary:
          $ref: '#/components/schemas/MemberIdentifier'

    Collectivity:
      type: object
      properties:
        id:
          type: string
        number:
          type: string
        name:
          type: string
        location:
          type: string

    CollectivityIdentity:
      type: object
      required: [number, name]
      properties:
        number:
          type: string
        name:
          type: string

    MemberIdentifier:
      type: string

    CreateMember:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        birthDate:
          type: string
          format: date
        gender:
          type: string
        address:
          type: string
        profession:
          type: string
        phoneNumber:
          type: integer
        email:
          type: string
        occupation:
          type: string
        collectivityIdentifier:
          type: string
        referees:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/MemberIdentifier'
        registrationFeePaid:
          type: boolean
        membershipDuesPaid:
          type: boolean

    Member:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string