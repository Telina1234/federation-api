openapi: 3.0.3
info:
  title: Fédération
  version: 1.0.0

servers:
  - url: http://localhost:8080

paths:
  /collectivites:
    post:
      summary: Créer une collectivité
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Collectivite'
      responses:
        '201':
          description: Created

  /admissions:
    post:
      summary: Admission membre
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdmissionRequest'
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request

  /paiements:
    post:
      summary: Enregistrer paiement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Paiement'
      responses:
        '200':
          description: OK

  /comptes:
    get:
      summary: Liste comptes
      responses:
        '200':
          description: OK

  /activites:
    post:
      summary: Créer activité
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Activite'
      responses:
        '201':
          description: Created

  /presences:
    post:
      summary: Enregistrer présence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Presence'
      responses:
        '200':
          description: OK

  /stats/collectivites/{id}:
    get:
      summary: Statistiques collectivité
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsCollectivite'

  /stats/federation:
    get:
      summary: Statistiques fédération
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StatsFederation'

components:
  schemas:
    Collectivite:
      type: object
      properties:
        id:
          type: integer
        nom:
          type: string
        ville:
          type: string
        specialite:
          type: string

    AdmissionRequest:
      type: object
      required:
        - collectiviteId
        - parrains
        - fraisAdhesion
        - cotisationAnnuelle
      properties:
        collectiviteId:
          type: integer
        nom:
          type: string
        prenom:
          type: string
        fraisAdhesion:
          type: number
        cotisationAnnuelle:
          type: number
        parrains:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/Parrain'

    Parrain:
      type: object
      properties:
        membreId:
          type: integer
        collectiviteId:
          type: integer
        relation:
          type: string

    Paiement:
      type: object
      properties:
        membreId:
          type: integer
        montant:
          type: number
        date:
          type: string
          format: date
        modePaiement:
          type: string
          enum: [ESPECE, VIREMENT, MOBILE_MONEY]

    Activite:
      type: object
      properties:
        nom:
          type: string
        date:
          type: string
          format: date
        obligatoire:
          type: boolean

    Presence:
      type: object
      properties:
        membreId:
          type: integer
        activiteId:
          type: integer
        present:
          type: boolean
        excuse:
          type: boolean

    StatsCollectivite:
      type: object
      properties:
        collectiviteId:
          type: integer
        tauxAssiduite:
          type: number
        totalCotisations:
          type: number
        montantImpayes:
          type: number

    StatsFederation:
      type: object
      properties:
        collectiviteId:
          type: integer
        tauxAssiduite:
          type: number
        pourcentageMembresAJour:
          type: number
        nouveauxAdherents:
          type: integer